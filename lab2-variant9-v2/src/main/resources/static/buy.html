<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Купить товар</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="card">
        <h1>Оформить покупку</h1>

        <nav class="nav">
            <a href="index.html">Каталог</a>
            <a href="add.html">Добавить</a>
            <a href="buy.html" class="active">Купить</a>
            <a href="delete.html">Удалить</a>
        </nav>

        <div id="message"></div>

        <form id="buyForm">
            <label for="productSelect">Товар</label>
            <select id="productSelect"></select>

            <label for="quantity">Количество</label>
            <input type="number" id="quantity" min="1" step="1" value="1">

            <button type="submit">Купить</button>
        </form>
    </main>

    <script src="app.js"></script>
</body>
</html>
